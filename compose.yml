version: '3.8'

services:
  mcp-odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-odoo-server
    ports:
      - "8000:8000"
    environment:
      # Odoo Configuration
      ODOO_URL: "${ODOO_URL:-https://your-odoo-instance.com}"
      ODOO_DB: "${ODOO_DB:-your-database-name}"
      ODOO_USERNAME: "${ODOO_USERNAME:-your-username}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:-your-password}"
      ODOO_TIMEOUT: "${ODOO_TIMEOUT:-30}"
      ODOO_VERIFY_SSL: "${ODOO_VERIFY_SSL:-1}"
      
      # Authentication Configuration
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_DB_PATH: "/app/data/auth.db"
      
      # HTTP Server Configuration
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      
      # Debug
      DEBUG: "${DEBUG:-0}"
      PYTHONUNBUFFERED: "1"
    
    volumes:
      # Persist authentication database
      - auth-data:/app/data
      # Optional: Mount logs for external access
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Run the HTTP server instead of direct MCP server
    command: ["python", "http_server.py"]

volumes:
  auth-data:
    driver: local
