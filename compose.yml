version: '3.8'

services:
  mcp-odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-odoo-server
    ports:
      # Expose HTTP server on port 8000
      # Change to "127.0.0.1:8000:8000" to only allow localhost access
      - "8000:8000"
    environment:
      # Odoo Connection Configuration
      # Replace with your actual Odoo instance details
      ODOO_URL: "${ODOO_URL:-https://your-odoo-instance.com}"
      ODOO_DB: "${ODOO_DB:-your-database-name}"
      ODOO_USERNAME: "${ODOO_USERNAME:-your-username}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:-your-password}"
      ODOO_TIMEOUT: "${ODOO_TIMEOUT:-30}"
      ODOO_VERIFY_SSL: "${ODOO_VERIFY_SSL:-1}"
      
      # Authentication Configuration
      # Set to 'true' to enable bearer token authentication
      # When enabled, all requests must include: Authorization: Bearer <token>
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_DB_PATH: "/app/data/auth.db"
      
      # HTTP Server Configuration
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      
      # Debug Configuration
      DEBUG: "${DEBUG:-0}"
      PYTHONUNBUFFERED: "1"
    
    volumes:
      # Persist authentication database across container restarts
      # This volume stores client credentials
      - auth-data:/app/data
      
      # Optional: Mount logs directory for external access
      # Uncomment to access logs from the host
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Run the HTTP server with authentication support
    # For direct MCP stdio mode, change to: ["python", "run_server.py"]
    command: ["python", "http_server.py"]

volumes:
  # Named volume for authentication database
  # Data persists even if container is removed
  # To backup: docker cp mcp-odoo-server:/app/data/auth.db ./backup.db
  auth-data:
    driver: local
