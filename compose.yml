version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-odoo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_auth}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-odoo-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Expose HTTP server on port 8000
      # Change to "127.0.0.1:8000:8000" to only allow localhost access
      - "8000:8000"
    environment:
      # Odoo Connection Configuration
      # Replace with your actual Odoo instance details
      ODOO_URL: "${ODOO_URL:-https://your-odoo-instance.com}"
      ODOO_DB: "${ODOO_DB:-your-database-name}"
      ODOO_USERNAME: "${ODOO_USERNAME:-your-username}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:-your-password}"
      ODOO_TIMEOUT: "${ODOO_TIMEOUT:-30}"
      ODOO_VERIFY_SSL: "${ODOO_VERIFY_SSL:-1}"
      
      # Authentication Configuration
      # Set to 'true' to enable bearer token authentication
      # When enabled, all requests must include: Authorization: Bearer <token>
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_DB_TYPE: "postgres"
      AUTH_DB_HOST: "postgres"
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: "${POSTGRES_DB:-mcp_auth}"
      AUTH_DB_USER: "${POSTGRES_USER:-mcp_user}"
      AUTH_DB_PASSWORD: "${POSTGRES_PASSWORD:-mcp_password}"
      
      # HTTP Server Configuration
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      
      # Debug Configuration
      DEBUG: "${DEBUG:-0}"
      PYTHONUNBUFFERED: "1"
    
    volumes:
      # Optional: Mount logs directory for external access
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Run the HTTP server with authentication support
    # For direct MCP stdio mode, change to: ["python", "run_server.py"]
    command: ["python", "http_server.py"]

volumes:
  # Named volume for PostgreSQL database
  # Data persists even if container is removed
  postgres-data:
    driver: local
